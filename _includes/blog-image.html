{% assign image = site.data.blog_variants[include.src] %}
{% if image %}
  {% assign image_width = image.full_width | append: '' %}
  <picture class="journal-picture">
    <img src="{{ image.jpeg[image_width] | relative_url }}?v={{ image.version }}"
      srcset="{% for variant in image.jpeg %}{{ variant[1] | relative_url }}?v={{ image.version }} {{ variant[0] }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
      sizes="{{ include.sizes | escape }}" width="{{ image.width }}" height="{{ image.height }}"
      alt="{{ include.alt | default: '' | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.priority %} fetchpriority="high"{% endif %}>
  </picture>
{% else %}
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: '' | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async">
{% endif %}
