<!-- begin hero -->
<section class="hero hero--video">
  <div class="hero__video">
    <!-- YouTube documents cc_lang_pref without cc_load_policy as not showing captions by default; viewer preferences may still apply. -->
    <iframe
      id="homepage-showreel"
      src="https://www.youtube.com/embed/gYODj4Rj_Rk?autoplay=1&amp;mute=1&amp;playsinline=1&amp;loop=1&amp;playlist=gYODj4Rj_Rk&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;iv_load_policy=3&amp;cc_lang_pref=en&amp;enablejsapi=1"
      title="Featured video"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager">
    </iframe>
    <button class="hero__playback-control" type="button" aria-label="Play video" aria-pressed="false">
      <span class="hero__playback-icon" aria-hidden="true"></span>
    </button>
    <button class="hero__fullscreen-control" type="button" aria-label="Play with sound in full screen" title="Full screen">
      <i class="fa-solid fa-expand" aria-hidden="true"></i>
    </button>
    <a class="hero__fullscreen-fallback" href="https://www.youtube.com/watch?v=gYODj4Rj_Rk" target="_blank" rel="noopener noreferrer" aria-label="Open video on YouTube; full screen is unavailable here" title="Open on YouTube" hidden>
      <i class="fa-solid fa-expand" aria-hidden="true"></i>
    </a>
    <button class="hero__unmute-control" type="button" aria-label="Unmute video">Unmute</button>
  </div>
<script>
  (() => {
    const hero = document.querySelector(".hero--video");
    const video = hero?.querySelector(".hero__video");
    const playerFrame = document.querySelector("#homepage-showreel");
    const playbackControl = hero?.querySelector(".hero__playback-control");
    const playbackIcon = hero?.querySelector(".hero__playback-icon");
    const fullscreenControl = hero?.querySelector(".hero__fullscreen-control");
    const fullscreenFallback = hero?.querySelector(".hero__fullscreen-fallback");
    const unmuteControl = hero?.querySelector(".hero__unmute-control");
    const header = document.querySelector(".header");

    if (!hero || !header) return;

    const updateHeaderHeight = () => {
      hero.style.setProperty("--header-height", `${header.getBoundingClientRect().height}px`);
    };

    updateHeaderHeight();
    window.addEventListener("resize", updateHeaderHeight, { passive: true });

    if ("ResizeObserver" in window) {
      new ResizeObserver(updateHeaderHeight).observe(header);
    }

    let player = null;
    let playerReady = false;
    let wasFullscreen = false;
    let openedFallback = false;

    const currentFullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const showFullscreenFallback = () => {
      fullscreenControl.hidden = true;
      fullscreenFallback.hidden = false;
    };

    if ((!video.requestFullscreen || document.fullscreenEnabled === false) &&
        !video.webkitRequestFullscreen) {
      showFullscreenFallback();
    }

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("homepage-showreel", {
        events: {
          onReady: () => {
            playerReady = true;
            player.mute();
            if (currentFullscreenElement() === video) unmuteControl.classList.add("is-visible");
            updatePlaybackState();
          },
          onStateChange: event => updatePlaybackState(event.data)
        }
      });
    };

    if (!window.YT?.Player) {
      const api = document.createElement("script");
      api.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(api);
    } else {
      window.onYouTubeIframeAPIReady();
    }

    const updatePlaybackState = state => {
      if (!playbackControl) return;
      if (!window.YT?.PlayerState) return;
      const playing = state === window.YT.PlayerState.PLAYING ||
        (playerReady && player?.getPlayerState() === window.YT.PlayerState.PLAYING);
      playbackControl.setAttribute("aria-label", playing ? "Pause video" : "Play video");
      playbackControl.setAttribute("aria-pressed", playing ? "true" : "false");
      playbackIcon?.classList.toggle("is-playing", playing);
    };

    playbackControl?.addEventListener("click", () => {
      if (!playerReady) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo();
      else player.playVideo();
    });

    const enterFullscreen = async () => {
      if (currentFullscreenElement() === video) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      try {
        if (playerReady) {
          player.unMute();
          player.playVideo();
        }
        if (video.requestFullscreen && document.fullscreenEnabled !== false) {
          await video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          await video.webkitRequestFullscreen();
        } else {
          throw new Error("Fullscreen is unavailable in this browser");
        }

        if (playerReady) {
          window.setTimeout(() => {
            if (currentFullscreenElement() === video && player.isMuted()) {
              unmuteControl?.classList.add("is-visible");
            }
          }, 300);
        }
      } catch (error) {
        console.warn("Could not enter fullscreen:", error);
        if (playerReady) player.mute();
        showFullscreenFallback();
      }
    };

    fullscreenControl?.addEventListener("click", enterFullscreen);

    fullscreenFallback?.addEventListener("click", () => {
      if (!playerReady) return;
      const time = Math.floor(player.getCurrentTime());
      fullscreenFallback.href = `https://www.youtube.com/watch?v=gYODj4Rj_Rk&t=${time}s`;
      player.mute();
      player.pauseVideo();
      openedFallback = true;
    });

    document.addEventListener("visibilitychange", () => {
      if (openedFallback && !document.hidden && playerReady) {
        openedFallback = false;
        player.mute();
        player.playVideo();
      }
    });

    unmuteControl?.addEventListener("click", () => {
      if (!playerReady) return;
      player.unMute();
      player.playVideo();
      unmuteControl.classList.remove("is-visible");
    });

    const updateFullscreen = () => {
      const inFullscreen = currentFullscreenElement() === video;
      hero.classList.toggle("is-fullscreen", inFullscreen);
      fullscreenControl?.setAttribute("aria-label", inFullscreen ? "Exit full screen" : "Play with sound in full screen");

      if (wasFullscreen && !inFullscreen && playerReady) {
        player.mute();
        unmuteControl?.classList.remove("is-visible");
      }
      wasFullscreen = inFullscreen;
    };
    document.addEventListener("fullscreenchange", updateFullscreen);
    document.addEventListener("webkitfullscreenchange", updateFullscreen);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && document.fullscreenElement === video) {
        document.exitFullscreen?.();
      }
    });

    playerFrame?.addEventListener("load", () => {
      if (playerReady) updatePlaybackState();
    });
  })();
</script>
</section>
<!-- end hero -->
